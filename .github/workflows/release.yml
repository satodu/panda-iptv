name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de versão para associar a release (ex: v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-linux-android:
    name: Build Linux & Android (APK, AppImage, Tarball)
    runs-on: ubuntu-22.04
    environment: BUILD
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      tag: ${{ steps.get_version.outputs.TAG }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Linux build dependencies & libmpv
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev libmpv-dev mpv curl

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run verification tests
        run: flutter test

      - name: Extract Version from Tag or Input
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            VERSION="${TAG#v}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAG="v${VERSION}"
          else
            VERSION="1.0.0"
            TAG="v1.0.0"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT
          echo "Building release for version: ${VERSION} (tag: ${TAG})"

      - name: Build Android APK
        run: |
          flutter build apk --release --dart-define=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
          mkdir -p dist
          rm -rf dist/*
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Panda-IPTV-${{ steps.get_version.outputs.VERSION }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Panda-IPTV.apk"

      - name: Build Linux Desktop Bundle
        run: |
          flutter build linux --release --dart-define=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
          cd build/linux/x64/release
          tar -czf "$GITHUB_WORKSPACE/dist/panda-iptv-${{ steps.get_version.outputs.VERSION }}-linux-x64.tar.gz" bundle/
          cd "$GITHUB_WORKSPACE"

      - name: Build Linux AppImage
        run: |
          chmod +x ./packaging/appimage/build_appimage.sh
          ./packaging/appimage/build_appimage.sh

      - name: Upload Linux and Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-linux-android
          path: dist/*
          retention-days: 1

  build-windows:
    name: Build Windows Desktop (x64 ZIP)
    runs-on: windows-latest
    environment: BUILD
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      tag: ${{ steps.get_version.outputs.TAG }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Extract Version from Tag or Input
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            VERSION="${TAG#v}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAG="v${VERSION}"
          else
            VERSION="1.0.0"
            TAG="v1.0.0"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT
          echo "Building Windows release for version: ${VERSION} (tag: ${TAG})"

      - name: Build Windows Executable
        run: flutter build windows --release --dart-define=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $version = "${{ steps.get_version.outputs.VERSION }}"
          7z a -tzip "dist/panda-iptv-$version-windows-x64.zip" .\build\windows\x64\runner\Release\*
          Copy-Item "dist/panda-iptv-$version-windows-x64.zip" "dist/Panda-IPTV-$version-windows-x64.zip"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-windows
          path: dist/*
          retention-days: 1

  publish-release:
    name: Publish Release Artifacts to GitHub
    needs: [build-linux-android, build-windows]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts for verification
        run: ls -la dist/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-linux-android.outputs.tag }}
          name: "Panda IPTV ${{ needs.build-linux-android.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/Panda-IPTV*.AppImage
            dist/Panda-IPTV*.apk
            dist/panda-iptv*-linux-x64.tar.gz
            dist/panda-iptv*-windows-x64.zip
            dist/Panda-IPTV*-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
